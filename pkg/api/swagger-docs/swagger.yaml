            type: string
        "404":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
        "503":
          description: error message
          schema:
            type: string
      summary: Get deployment request
      tags:
      - deployments
  /deployments:
    delete:
      description: Delete the deployments of the given modules as a job. All deployments
        are deleted if allow_all is set and no module IDs are given.
