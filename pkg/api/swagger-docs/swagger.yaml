        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: filter by module IDs
        in: query
        items:
          type: string
        name: module_ids
        type: array
      - collectionFormat: csv
        description: filter by advertisement references
        in: query
        items:
          type: string
        name: references
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: reduced deployment advertisements
          schema:
            items:
              $ref: '#/definitions/models.DeploymentAdvertisementReduced'
            type: array
        "400":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      summary: Query deployment advertisements
      tags:
      - deployment-advertisements
  /deployment-advertisements/{ADV_ID}:
    get:
      description: Query a single deployment advertisement by its ID with a reduced
        set of fields.
      parameters:
