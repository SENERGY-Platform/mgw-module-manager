  github_com_SENERGY-Platform_mgw-module-manager_lib_models.AuxiliaryDeployment:
    properties:
      configs:
        additionalProperties:
          type: string
        description: '{varName:value} environment variables passed to the container,
          merged with the configs of the owning deployment'
        type: object
      container:
        allOf:
        - $ref: '#/definitions/models.Container'
        description: identity and runtime state of the container
      created:
        description: point in time at which the auxiliary deployment was created
        type: string
      deployment_id:
        description: ID of the deployment that owns the auxiliary deployment
        type: string
      enabled:
        description: true if the container is meant to be running, disabled auxiliary
          deployments are not started and not health checked
        type: boolean
      id:
        description: unique ID of the auxiliary deployment
        type: string
      image:
        description: container image, must match one of the image sources declared
          by the module
        type: string
      labels:
        additionalProperties:
          type: string
        description: '{name:value} labels set on creation or update, usable to filter
          auxiliary deployments'
        type: object
      name:
        description: human readable name, taken from the module auxiliary service
          if not set on creation
        type: string
      recreate:
        description: true if the auxiliary deployment is recreated when the owning
          deployment is updated, otherwise it is left untouched and keeps running
          against the previous module version
        type: boolean
      reference:
        description: reference of the module auxiliary service the auxiliary deployment
          is based on
        type: string
      run_config:
        allOf:
        - $ref: '#/definitions/models.AuxiliaryDeploymentRunConfig'
        description: effective run configuration of the container
      updated:
        description: point in time at which the auxiliary deployment was last updated
        type: string
      volumes:
        additionalProperties:
          type: string
        description: '{mntPoint:ref} auxiliary deployment volumes by mount point within
          the container'
        type: object
