        type: object
      id:
        description: unique ID of the deployment
        type: string
      module_channel:
        description: channel of the repository the deployed module version was installed
          from
        type: string
      module_source:
        description: source of the repository the deployed module version was installed
          from
        type: string
      module_version:
        description: version of the module the deployment was created for, can differ
          from the installed version until the deployment is updated
        type: string
      secrets:
        additionalProperties:
          $ref: '#/definitions/github_com_SENERGY-Platform_mgw-module-manager_lib_models.DeploymentSecret'
        description: secrets set as user input by module secret reference
        type: object
      state:
        description: 'health state determined by container states, values: 1 = healthy,
          2 = unhealthy, 0 if the deployment is disabled or the state could not be
          determined'
        type: integer
      updated:
        description: point in time at which the deployment was last updated
        type: string
      volumes:
        additionalProperties:
          type: string
        description: '{reference:name} docker volume names by module volume reference'
        type: object
