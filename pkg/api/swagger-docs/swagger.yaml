  title: module-manager API
  version: dev
paths:
  /deployment-advertisements:
    get:
      description: Query the advertisements of all deployments with a reduced set
        of fields.
      parameters:
      - collectionFormat: csv
        description: filter by advertisement IDs
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: filter by module IDs
        in: query
        items:
          type: string
        name: module_ids
        type: array
      - collectionFormat: csv
        description: filter by advertisement references
        in: query
        items:
          type: string
        name: references
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: reduced deployment advertisements
          schema:
            items:
              $ref: '#/definitions/models.DeploymentAdvertisementReduced'
            type: array
        "400":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      summary: Query deployment advertisements
      tags:
      - deployment-advertisements
  /deployment-advertisements/{ADV_ID}:
    get:
      description: Query a single deployment advertisement by its ID with a reduced
        set of fields.
      parameters:
      - description: advertisement ID
        in: path
        name: ADV_ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: reduced deployment advertisement
          schema:
            $ref: '#/definitions/models.DeploymentAdvertisementReduced'
        "404":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      summary: Query deployment advertisement
      tags:
      - deployment-advertisements
  /deployment-request:
