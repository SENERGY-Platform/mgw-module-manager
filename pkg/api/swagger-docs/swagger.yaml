          schema:
            type: string
        "404":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
        "503":
          description: error message
          schema:
            type: string
      summary: Create deployments
      tags:
      - deployments
    put:
      consumes:
      - application/json
      description: Update the deployments of the given modules as a job.
      parameters:
      - description: deployment user inputs
        in: body
        name: request
        required: true
        schema:
          items:
