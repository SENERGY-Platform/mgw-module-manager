        "400":
          description: error message
          schema:
            type: string
        "404":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
        "503":
          description: error message
          schema:
            type: string
      summary: Create deployments
      tags:
      - deployments
    put:
      consumes:
      - application/json
      description: Update the deployments of the given modules as a job.
      parameters:
      - description: deployment user inputs
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/github_com_SENERGY-Platform_mgw-module-manager_lib_models.DeploymentUserInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: job
          schema:
            $ref: '#/definitions/models.Job'
        "400":
          description: error message
          schema:
            type: string
        "404":
          description: error message
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
        "503":
          description: error message
